<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #eee;
  }
  h1 {
    margin-bottom: 12px;
    font-size: 28px;
    color: #0ff;
    text-shadow: 0 0 12px rgba(0,255,255,0.5);
    letter-spacing: 2px;
  }
  #score {
    margin-bottom: 12px;
    font-size: 18px;
    color: #0f0;
  }
  canvas {
    border: 2px solid #0ff;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,255,255,0.2);
    background: #16213e;
  }
  #info {
    margin-top: 14px;
    font-size: 14px;
    color: #888;
    text-align: center;
  }
  #restart {
    margin-top: 14px;
    padding: 10px 28px;
    font-size: 16px;
    color: #0ff;
    background: transparent;
    border: 2px solid #0ff;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
    display: none;
  }
  #restart:hover {
    background: #0ff;
    color: #16213e;
  }
</style>
</head>
<body>
  <h1>🐍 ЗМЕЙКА</h1>
  <div id="score">Счёт: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <button id="restart" onclick="init()">Играть снова</button>
  <div id="info">Управление: стрелки ← ↑ → ↓<br>или WASD</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const size = 20;
const cols = canvas.width / size;
const rows = canvas.height / size;

let snake, dir, nextDir, food, score, gameOver, loop;

function init() {
  snake = [{x: 9, y: 9}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  gameOver = false;
  placeFood();
  document.getElementById('score').textContent = 'Счёт: ' + score;
  document.getElementById('restart').style.display = 'none';
  clearInterval(loop);
  loop = setInterval(tick, 120);
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * cols),
      y: Math.floor(Math.random() * rows)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function tick() {
  if (gameOver) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Столкновение со стеной
  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
    endGame();
    return;
  }
  // Столкновение с собой
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = 'Счёт: ' + score;
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Еда
  ctx.fillStyle = '#f44';
  ctx.beginPath();
  ctx.arc(food.x * size + size/2, food.y * size + size/2, size/2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // Змейка
  snake.forEach((s, i) => {
    const g = Math.floor(255 - i * 5);
    ctx.fillStyle = i === 0 ? '#0f0' : `rgb(0,${Math.max(g,80)},0)`;
    ctx.fillRect(s.x * size + 1, s.y * size + 1, size - 2, size - 2);
  });
}

function endGame() {
  gameOver = true;
  clearInterval(loop);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f44';
  ctx.font = 'bold 36px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, canvas.height / 2 - 10);
  ctx.fillStyle = '#0f0';
  ctx.font = '20px Arial';
  ctx.fillText('Счёт: ' + score, canvas.width / 2, canvas.height / 2 + 30);
  document.getElementById('restart').style.display = 'block';
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((k === 'arrowup'    || k === 'w') && dir.y !== 1)  nextDir = {x: 0, y: -1};
  if ((k === 'arrowdown'  || k === 's') && dir.y !== -1) nextDir = {x: 0, y: 1};
  if ((k === 'arrowleft'  || k === 'a') && dir.x !== 1)  nextDir = {x: -1, y: 0};
  if ((k === 'arrowright' || k === 'd') && dir.x !== -1) nextDir = {x: 1, y: 0};
  if (['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
});

init();
</script>
</body>
</html>
